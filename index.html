<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card UI Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <span class="logo">
                <img src="OIP-removebg-preview.png" alt="" >
                <h5>Master Card</h5>
            </span>
            <img src="Screenshot_2026-09-30_174118-removebg-preview.png" alt="" class="chip">
        </header>
        <div class="card-details">
            <div class="name-number">
                <h6 class="cn">Card Number</h6>
                <h5 class="number">8050 5040 3169 6967</h5>
                <h5 class="name">Osama bin Laden</h5>
            </div>
            <div class="valid-date">
                <h6>Valid Thru</h6>
                <h5>9/11</h5>
            </div>
        </div>
    </div>
</body>
</html>
